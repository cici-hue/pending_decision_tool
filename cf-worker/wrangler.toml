name = "deepseek-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

# DeepSeek API Key - 使用 wrangler secret put DEEPSEEK_API_KEY 设置

# 允许的 CORS 来源（生产环境填你的前端域名）
[vars]
ALLOWED_ORIGIN = "*"
DEEPSEEK_API_URL = "https://api.deepseek.com/v1/chat/completions"
DEEPSEEK_MODEL = "deepseek-chat"
